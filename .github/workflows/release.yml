name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - examples/**
      - scripts/**
      - tests/**
      - package.json
      - .releaserc.json

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: bun install

      - run: bun run check

      - run: bun run test:tools

      - run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
